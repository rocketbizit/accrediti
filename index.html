<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Accrediti Pro - Evento</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased overflow-x-hidden">

    <div id="offlineAlert" class="hidden bg-orange-500 text-white text-center py-1 text-xs font-bold sticky top-0 z-50">
        MODALITÀ OFFLINE - I dati sono salvati solo sul dispositivo
    </div>

    <header class="bg-white border-b border-slate-200 p-4 sticky top-0 z-40 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div id="logoContainer" class="h-10 w-10 bg-slate-100 rounded flex items-center justify-center overflow-hidden">
                <i class="fa-solid fa-bolt text-indigo-500"></i>
            </div>
            <h1 class="font-bold text-lg leading-tight">Accrediti<br><span class="text-indigo-600 text-sm">Manager</span></h1>
        </div>
        <div class="flex gap-2">
            <button onclick="apriSearchModal()" class="p-2 bg-slate-100 rounded-lg text-slate-600" title="Cerca ospite">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
            <button onclick="apriAddGuestModal()" class="p-2 bg-slate-100 rounded-lg text-slate-600" title="Nuovo ospite last-minute">
                <i class="fa-solid fa-user-plus"></i>
            </button>
            <button onclick="esportaCSV()" class="p-2 bg-slate-100 rounded-lg text-slate-600" title="Scarica CSV">
                <i class="fa-solid fa-download"></i>
            </button>
            <button onclick="sincronizzaConGoogleSheet()" class="p-2 bg-indigo-600 rounded-lg text-white" title="Sincronizza Google Sheets">
                <i class="fa-solid fa-rotate"></i>
            </button>
        </div>
    </header>

    <main class="p-4 max-w-2xl mx-auto space-y-6">
        
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <span class="text-slate-400 text-xs font-bold uppercase">Presenti</span>
                <div class="text-2xl font-black text-indigo-600" id="statPresenti">0</div>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <span class="text-slate-400 text-xs font-bold uppercase">Mancanti</span>
                <div class="text-2xl font-black text-slate-400" id="statMancanti">0</div>
            </div>
        </div>

        <section class="bg-black rounded-3xl overflow-hidden relative shadow-xl min-h-[300px]">
            <div id="reader" class="w-full"></div>
            <div id="scannerOverlay" class="absolute inset-0 flex items-center justify-center pointer-events-none border-2 border-transparent">
                <div class="w-64 h-64 border-2 border-white/30 rounded-3xl"></div>
            </div>
        </section>

    </main>

    <div id="searchModal" class="fixed inset-0 z-50 flex items-center justify-center p-6 hidden">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm" onclick="chiudiSearchModal()"></div>
        <div class="bg-white w-full max-w-md rounded-3xl p-8 relative z-10 transform transition-all">
            <h3 class="text-2xl font-bold mb-4 text-slate-800">Cerca Ospite</h3>
            <div class="relative mb-6">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" onkeyup="cercaDebounced()" 
                    placeholder="Cerca nome o cognome..." 
                    class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div id="risultatiRicerca" class="space-y-2 max-h-60 overflow-y-auto"></div>
            <button onclick="chiudiSearchModal()" class="w-full mt-6 py-4 bg-slate-100 rounded-2xl font-bold text-slate-700">Chiudi</button>
        </div>
    </div>

    <div id="addGuestModal" class="fixed inset-0 z-50 flex items-center justify-center p-6 hidden">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm" onclick="chiudiAddGuestModal()"></div>
        <div class="bg-white w-full max-w-md rounded-3xl p-8 relative z-10 transform transition-all">
            <h3 class="text-2xl font-bold mb-6 text-slate-800">Nuovo Ospite Last-Minute</h3>
            <form onsubmit="aggiungiOspiteEChiudi(event)" class="grid grid-cols-2 gap-3">
                <input type="text" id="fn" placeholder="Nome" class="col-span-1 p-3 bg-slate-50 rounded-xl outline-none border border-slate-200" required>
                <input type="text" id="ln" placeholder="Cognome" class="col-span-1 p-3 bg-slate-50 rounded-xl outline-none border border-slate-200" required>
                <input type="tel" id="tel" placeholder="Telefono" class="col-span-2 p-3 bg-slate-50 rounded-xl outline-none border border-slate-200">
                <input type="email" id="em" placeholder="Email" class="col-span-2 p-3 bg-slate-50 rounded-xl outline-none border border-slate-200">
                <input type="text" id="az" placeholder="Azienda (opzionale)" class="col-span-2 p-3 bg-slate-50 rounded-xl outline-none border border-slate-200">
                <button type="submit" class="col-span-2 bg-indigo-600 text-white font-bold py-4 rounded-xl mt-3">Registra ed Entra</button>
            </form>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center p-6 hidden">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm" onclick="chiudiModal()"></div>
        <div id="modalContent" class="bg-white w-full max-w-sm rounded-3xl p-8 text-center relative z-10 transform transition-all">
            <div id="modalIcon" class="text-6xl mb-4"></div>
            <h3 id="modalTitle" class="text-2xl font-bold"></h3>
            <p id="modalText" class="text-slate-500 mt-2 mb-6"></p>
            <button onclick="chiudiModal()" class="w-full py-4 bg-slate-100 rounded-2xl font-bold text-slate-700">OK, Continua</button>
        </div>
    </div>

    <script>
        function apriSearchModal() {
            document.getElementById('searchModal').classList.remove('hidden');
        }
        function chiudiSearchModal() {
            document.getElementById('searchModal').classList.add('hidden');
        }
        function apriAddGuestModal() {
            document.getElementById('addGuestModal').classList.remove('hidden');
        }
        function chiudiAddGuestModal() {
            document.getElementById('addGuestModal').classList.add('hidden');
        }
        function aggiungiOspiteEChiudi(event) {
            aggiungiOspite(event);
            chiudiAddGuestModal();
        }
    </script>

    <script src="app.js"></script>
</body>
</html>
